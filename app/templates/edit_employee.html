<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Employee - CloudTask</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <nav class="navbar">
        <div class="logo">
            <span class="logo-mark">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M7 18a4 4 0 0 1-.6-7.96A5 5 0 0 1 16 8a3.5 3.5 0 0 1 .5 6.98" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M8.5 13.3l2 2 4-4.3" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </span>
            CloudTask
        </div>
        <div class="nav-links">
            <a href="{{ url_for('main.dashboard') }}">Dashboard</a>
            <a href="{{ url_for('employees.employee_list') }}">Employees</a>
            <a href="{{ url_for('auth.logout') }}">Log out</a>
        </div>
    </nav>

    <div class="form-page">
        <a href="{{ url_for('employees.employee_list') }}" class="back-link">← Back to employees</a>

        <div class="form-shell">
            <div class="auth-box">
                <span class="eyebrow">Edit record</span>
                <h1>Edit employee</h1>
                <p>Update {{ employee.name }}'s details.</p>

                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% for category, message in messages %}
                        <div class="message {{ category }}">{{ message }}</div>
                    {% endfor %}
                {% endwith %}

                <form method="POST">
                    <div class="field">
                        <label for="name">Full name</label>
                        <input type="text" id="name" name="name" value="{{ employee.name }}" placeholder="Full name" required>
                    </div>
                    <div class="field">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" value="{{ employee.email }}" placeholder="Email" required>
                    </div>
                    <div class="field">
                        <label for="department">Department</label>
                        <input type="text" id="department" name="department" value="{{ employee.department }}" placeholder="Department" required>
                    </div>
                    <div class="field">
                        <label for="role">Job role</label>
                        <input type="text" id="role" name="role" value="{{ employee.role }}" placeholder="Job role" required>
                    </div>
                    <div class="field">
                        <label for="joining_date">Joining date</label>
                        <input type="date" id="joining_date" name="joining_date" value="{{ employee.joining_date }}" required>
                    </div>
                    <button type="submit">Update employee</button>
                </form>
            </div>
        </div>
    </div>

</body>
</html>
